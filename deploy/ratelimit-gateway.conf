# ============================================================
# NewAPI 限速网关 - 宝塔 Nginx 扩展挂载配置
# ============================================================
# 上传位置:
#   /www/server/panel/vhost/nginx/extension/api-mall.chatfire.cn/ratelimit-gateway.conf
# 生效方式:
#   nginx -t && nginx -s reload
# 说明:
#   1. 本文件是被主配置 include 的「片段」，直接写 location，不要包 server {}
#   2. 网关默认监听 8080（对应 .env 中 SERVER_PORT=8080）；若部署在其他机器，把 127.0.0.1 换成网关内网 IP
#   3. 若主配置里已经配过 location /v1/，请删除下方第 1 段，避免 duplicate location 报错
#   4. 管理后台访问地址: https://api-mall.chatfire.cn/web/
#      登录时「网关地址」填 https://api-mall.chatfire.cn （同源），Token 填 ADMIN_AUTH_TOKEN
# ============================================================

# ---- 1. API 调用 → 限速网关（无缝切换核心）----
location /v1/ {
    proxy_pass http://127.0.0.1:8080;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 流式(SSE)响应必须关闭缓冲
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;

    # LLM 流式调用耗时较长
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# ---- 2. 管理后台页面 → 网关静态目录 ----
# 无尾斜杠时跳转，避免落到主配置的 location /
location = /web { return 301 /web/; }

location /web/ {
    proxy_pass http://127.0.0.1:8080;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 静态资源可缓存，改版后浏览器可能需强刷一次
    expires 5m;
}

# ---- 3. 管理 API → 网关（分组增删改 / 手动同步）----
# 安全建议：生产环境取消下面两行注释，只放行管理员 IP
#   allow 10.0.0.0/8;      # 内网网段
#   allow 203.0.113.10;    # 你的办公出口 IP（改成实际值）
#   deny all;              # 其余一律 403，请求到不了网关
location /admin/ {
    proxy_pass http://127.0.0.1:8080;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---- 4. Key 限速状态查询 → 网关（管理后台"查询 Key"功能）----
location /ratelimit/ {
    proxy_pass http://127.0.0.1:8080;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
